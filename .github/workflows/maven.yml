# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: BessolitsynIV_IPR_AT CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      TRELLO_USER: ${{secrets.TRELLO_USER}}
      TRELLO_PASSWORD: ${{secrets.TRELLO_PASSWORD}}
      USER: ${{secrets.USER}}
      PASSWORD: ${{secrets.PASSWORD}}
      DB_USER: ${{secrets.DB_USER}}
      DB_PASSWORD: ${{secrets.DB_PASSWORD}}
      DB_URL: ${{secrets.DB_URL}}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Run tests
      run: mvn clean test -DtrelloUser=$TRELLO_USER -DtrelloPassword=$TRELLO_PASSWORD -Duser=$USER -Dpassword=$PASSWORD -DdbUser=$DB_USER -DdbPassword=$DB_PASSWORD -DdbUrl=$DB_URL
